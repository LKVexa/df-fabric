name: Validate release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify hashes and run portable suites
        run: python -B tools/validate_release.py
      - name: Install declared fabric dependencies
        run: >-
          python -m pip install --only-binary=:all: -r REQUIREMENTS.txt
      - name: Run available fabric gates with declared dependencies
        run: python -B adapter/dfabric/cli.py fabric-verify
